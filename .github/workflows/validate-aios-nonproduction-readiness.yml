name: Validate AIOS Non-production Readiness

on:
  pull_request:
    paths:
      - "Governance/AIOS-Nonproduction-Readiness-*"
      - "Governance/AIOS-Stage15-Local-Python-Rehearsal-*"
      - "Governance/AIOS-Stage-Registry.md"
      - "Governance/AIOS-Project-Registry.md"
      - "Runtime/stage15_local_python_rehearsal.py"
      - "Tests/Fixtures/nonproduction-readiness/**"
      - "Tests/AIOS-Nonproduction-Readiness-Validation.md"
      - "Tests/AIOS-Stage15-Local-Python-Rehearsal-Validation.md"
      - "Tests/test_nonproduction_readiness.py"
      - "Tests/test_stage15_local_python_rehearsal.py"
      - "Tests/test_stage15_rehearsal_execution_ledger.py"
      - "Tests/test_project_governance.py"
      - "Tests/validate_aios_nonproduction_readiness.py"
      - "Tests/validate_aios_stage15_local_python_rehearsal.py"
      - "Tests/validate_aios_stage15_rehearsal_execution_ledger.py"
      - "docs/superpowers/specs/2026-07-23-nonproduction-readiness-remediation-integration-design.md"
      - "docs/superpowers/plans/2026-07-23-nonproduction-readiness-remediation-integration.md"
      - ".github/workflows/validate-aios-nonproduction-readiness.yml"

permissions:
  contents: read

concurrency:
  group: aios-nonproduction-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate local synthetic integration proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python3 Tests/validate_aios_nonproduction_readiness.py
      - run: python3 Tests/validate_aios_stage15_local_python_rehearsal.py
      - run: python3 Tests/validate_aios_stage15_rehearsal_execution_ledger.py
      - run: python3 -m unittest Tests.test_nonproduction_readiness -v
      - run: python3 -m unittest Tests.test_stage15_local_python_rehearsal -v
      - run: python3 -m unittest Tests.test_stage15_rehearsal_execution_ledger -v
      - run: python3 -m unittest Tests.test_project_governance -v
      - run: python3 -m unittest discover -s Tests -p 'test_*.py' -v
      - run: python3 Tests/validate_aios_workflow_schema.py
      - run: python3 -m compileall -q Runtime Tests
